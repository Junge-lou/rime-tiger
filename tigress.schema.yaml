# Rime schema: tigress
# encoding: utf-8
#
# 本文件是“词库”方案。
#
# 配置来源：
#   tiger_base.schema.yaml -> tigress.schema.yaml
#
# 本方案启用加词、删词、调序和候选管理。
# 底层使用全字集词典；常用字/全字集由 extended_char 开关过滤。
#
# 修改指南：
#   1. 只改词库方案：改本文件 / tigress.custom.yaml。
#   2. 虎码方案都要改：改 tiger_base.schema.yaml / tiger_base.custom.yaml。

__include: tiger_base.schema:/

schema:
  description: |
    虎码官方词库
    字典：全字集 99144 字；默认常用字过滤，Ctrl+H 切换全字集
    敲 ` 鍵進入拼音反查
  name: "虎码词库"
  schema_id: tigress
  # 显式版本号，须高于小狼毫安装目录自带副本（0.9），否则部署时用户副本会被当作过时文件清进 trash/。
  # version 写在 tiger_base 里没用：librime 的版本比较是纯文本读取，不解析 __include。
  version: "1.0"

translator:
  dictionary: tigress.extended
